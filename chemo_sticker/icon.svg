<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0004"/>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Decorative sparkles -->
  <circle cx="88" cy="12" r="3.5" fill="white" opacity="0.35"/>
  <circle cx="80" cy="22" r="1.8" fill="white" opacity="0.25"/>
  <circle cx="12" cy="80" r="4"   fill="white" opacity="0.20"/>
  <circle cx="20" cy="90" r="2"   fill="white" opacity="0.18"/>
  <text x="6"  y="20" font-size="9" fill="white" opacity="0.45" font-family="Arial">✦</text>
  <text x="83" y="88" font-size="7" fill="white" opacity="0.35" font-family="Arial">✦</text>

  <!-- Label body -->
  <rect x="13" y="18" width="74" height="65" rx="7" fill="white" filter="url(#shadow)" opacity="0.97"/>

  <!-- Warning stripe at top of label -->
  <rect x="13" y="18" width="74" height="16" rx="7" fill="url(#stripe)"/>
  <rect x="13" y="27" width="74" height="7"  fill="url(#stripe)"/>

  <!-- Warning text on stripe -->
  <text x="50" y="22" text-anchor="middle" font-size="5.2" font-weight="bold"
        fill="white" font-family="Arial,sans-serif" letter-spacing="0.8">◆ CYTOTOXIC ◆</text>
  <text x="50" y="30" text-anchor="middle" font-size="4.5" font-weight="bold"
        fill="white" font-family="Arial,sans-serif" letter-spacing="0.6">★ HIGH ALERT ★</text>

  <!-- Patient name line -->
  <rect x="19" y="39" width="62" height="4"   rx="2" fill="#c7d2fe"/>

  <!-- Drug name line (thick/bold) -->
  <rect x="19" y="47" width="62" height="6.5" rx="3" fill="#6366f1" opacity="0.75"/>

  <!-- Vol + rate lines -->
  <rect x="19" y="58" width="44" height="3.5" rx="1.8" fill="#ddd6fe"/>
  <rect x="19" y="64" width="55" height="3.5" rx="1.8" fill="#ddd6fe"/>

  <!-- Divider -->
  <line x1="13" y1="72" x2="87" y2="72" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Staff dots -->
  <circle cx="28" cy="78" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="50" cy="78" r="4" fill="#a78bfa" opacity="0.7"/>
  <circle cx="72" cy="78" r="4" fill="#a78bfa" opacity="0.7"/>
</svg>
