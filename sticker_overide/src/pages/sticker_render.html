<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Custom IPD Sticker Render</title>
  <link rel="stylesheet" href="sticker_render.css">
</head>
<body>
  <aside class="toolbar no-print">
    <div>
      <strong>Custom IPD Sticker Render</strong>
      <span id="captureInfo">Loading...</span>
    </div>
    <div class="toolbar-actions">
      <button id="btnPrint">Print / Save PDF</button>
      <button id="btnExportJson">Export JSON</button>
      <button id="btnShowRaw">Show raw rows</button>
    </div>
  </aside>

  <main id="app"></main>

  <dialog id="rawDialog">
    <header>
      <strong>Raw captured data</strong>
      <button id="btnCloseRaw">Close</button>
    </header>
    <pre id="rawOutput"></pre>
  </dialog>

  <script src="../libs/qrcode.min.js"></script>
  <script src="sticker_render.js"></script>
</body>
</html>
