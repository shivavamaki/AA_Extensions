<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemo Label</title>
<link rel="icon" href="../images/icon48.png">
<style>
/* ── Fonts ──────────────────────────────────────────────────────── */
@font-face {
  font-family: 'THSarabun';
  src: url('../src/assets/fonts/Sarabun-Regular.ttf') format('truetype');
  font-weight: normal;
}
@font-face {
  font-family: 'THSarabun';
  src: url('../src/assets/fonts/THSarabunNew-Bold.ttf') format('truetype');
  font-weight: bold;
}

/* ── Pastel design tokens ───────────────────────────────────────── */
:root {
  --bg:     #edf0f7;
  --surf:   #ffffff;
  --card:   #f4f6fb;
  --brd:    #d5dcee;
  --brd2:   #c2ccdf;
  --txt:    #1e2d4a;
  --dim:    #6b7fa3;
  --hi:     #3a6bbf;
  --hi2:    #e8eef8;
  --green:  #2c7a45;
  --gbg:    #e6f4eb;
  --red:    #c0392b;
  --warn:   #fff8e1;
  --fam:    'THSarabun','TH Sarabun New','Leelawadee UI','Tahoma',sans-serif;
  --shadow: 0 2px 8px rgba(60,80,140,.10);
  --ink:    #111;
  --paper:  #fff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--fam);
  background: var(--bg);
  color: var(--txt);
  min-height: 100vh;
}

/* ══ TOP NAV ════════════════════════════════════════════════════════ */
#topnav {
  background: var(--surf);
  border-bottom: 1.5px solid var(--brd);
  padding: 0 20px;
  display: flex;
  align-items: center;
  height: 46px;
  box-shadow: 0 1px 4px rgba(60,80,140,.07);
  position: sticky;
  top: 0;
  z-index: 100;
}

.app-logo {
  font-size: 16px;
  font-weight: bold;
  color: var(--hi);
  margin-right: 28px;
  letter-spacing: 0.3px;
}

.tab-btn {
  height: 46px;
  padding: 0 18px;
  background: transparent;
  border: none;
  border-bottom: 2.5px solid transparent;
  color: var(--dim);
  font-family: var(--fam);
  font-size: 14px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--txt); }
.tab-btn.active {
  color: var(--hi);
  border-bottom-color: var(--hi);
  font-weight: bold;
}

/* ══ STICKER TAB ════════════════════════════════════════════════════ */
#tab-sticker {
  display: flex;
  height: calc(100vh - 46px);
}

/* ── Sidebar ─────────────────────────────────────────────────────── */
#sidebar {
  width: 390px;
  min-width: 320px;
  background: var(--surf);
  border-right: 1.5px solid var(--brd);
  overflow-y: auto;
  padding: 14px 13px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.sec {
  background: var(--card);
  border: 1px solid var(--brd);
  border-radius: 8px;
  padding: 12px 13px;
}

.sec-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--hi);
  font-weight: bold;
  margin-bottom: 10px;
}

.field { margin-bottom: 9px; }
.field:last-child { margin-bottom: 0; }

.field > label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
  color: var(--dim);
  margin-bottom: 4px;
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 7px 10px;
  background: var(--surf);
  border: 1px solid var(--brd2);
  border-radius: 5px;
  color: var(--txt);
  font-family: var(--fam);
  font-size: 15px;
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--hi);
  box-shadow: 0 0 0 3px rgba(58,107,191,.12);
}

.field select option { background: #fff; color: var(--txt); }

.row2 { display: flex; gap: 8px; }
.row2 .field { flex: 1; }
.row3 { display: flex; gap: 6px; }
.row3 .field { flex: 1; }

.atag {
  font-size: 9px;
  background: var(--hi2);
  color: var(--hi);
  padding: 1px 5px;
  border-radius: 8px;
}

.abox {
  padding: 6px 10px;
  background: var(--bg);
  border: 1px dashed var(--brd2);
  border-radius: 5px;
  color: var(--hi);
  font-size: 14px;
  min-height: 32px;
  line-height: 1.4;
}
.abox.dim { color: var(--brd2); font-style: italic; font-size: 13px; }

.btn-print {
  padding: 11px;
  background: var(--green);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  font-family: var(--fam);
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  box-shadow: 0 2px 6px rgba(44,122,69,.2);
  transition: filter .15s;
}
.btn-print:hover { filter: brightness(1.1); }

.btn-clear {
  padding: 8px;
  background: transparent;
  color: var(--dim);
  border: 1px solid var(--brd2);
  border-radius: 6px;
  font-size: 14px;
  font-family: var(--fam);
  cursor: pointer;
  width: 100%;
}
.btn-clear:hover { background: var(--card); }

/* ── Preview panel ───────────────────────────────────────────────── */
#preview-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  background-image: radial-gradient(circle at 50% 40%, #dde5f7 0%, #edf0f7 70%);
  padding: 24px;
  overflow-y: auto;
  gap: 20px;
}

.prev-label {
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  align-self: center;
}

.scale-host {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 320px;
}

.scale-wrap {
  transform: scale(1.85);
  transform-origin: center center;
  display: inline-block;
  filter: drop-shadow(0 4px 16px rgba(60,80,140,.25));
}

/* ══════════════════════════════════════════════════════════════════
   STICKER — 10cm × 5cm  |  top 1.5cm = logo space (blank)
══════════════════════════════════════════════════════════════════ */
.sticker {
  width: 10cm;
  height: 5cm;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fam);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  text-rendering: geometricPrecision;
  -webkit-font-smoothing: antialiased;
}

/* ── Header row: 1.5cm tall, split left/right ── */
.stk-header {
  display: flex;
  align-items: stretch;
  height: 1.5cm;
  flex-shrink: 0;
  border-bottom: 0.3mm solid var(--ink);
}

/* 1.5cm tall × 5cm wide (left to center) — logo pre-printed here */
.stk-logospace {
  width: 5cm;
  flex-shrink: 0;
  border-right: 0.3mm solid var(--ink);
}

/* Right portion: warning text fills the rest of the header */
.stk-warn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0.8mm 2mm;
  background: #555;
  color: #fff;
  text-align: center;
}

.stk-warn-top {
  font-size: 9pt;
  font-weight: bold;
  letter-spacing: 0.5px;
  line-height: 1.1;
}

.stk-warn-bot {
  font-size: 7.5pt;
  font-weight: bold;
  letter-spacing: 0.4px;
  line-height: 1.1;
}

/* ── Patient row: Name 60% | HN 20% | Room 20% ── */
.stk-patient {
  display: flex;
  align-items: baseline;
  padding: 0.3mm 2.5mm 0.2mm;
  border-bottom: 0.2mm solid #bbb;
  flex-shrink: 0;
}
.stk-name    { flex: 1;    font-size: 11pt; font-weight: bold; line-height: 1.05; }
.stk-hn-room { flex: 0 0 auto; font-size: 9pt; text-align: right; white-space: nowrap; }

/* ── Drug section: all centered ── */
.stk-drug-sec {
  text-align: center;
  padding: 0.3mm 2mm 0.2mm;
  border-bottom: 0.2mm solid #bbb;
  flex-shrink: 0;
}
.stk-drug-name { font-size: 13pt; font-weight: bold; line-height: 1.05; }
.stk-drug-row2 { font-size: 9.5pt; line-height: 1.1; }
.stk-rate-line { font-size: 9.5pt; line-height: 1.1; }

/* ── Merged dates + staff: 2 rows ── */
.stk-dates-staff {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0.3mm 2.5mm;
  gap: 0.5mm;
}
.stk-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 9.5pt;
  line-height: 1.15;
}
.split-role { font-size: 8pt; color: #111; }

/* ── Footer: all-warning 1 line, centered ── */
.stk-footer {
  padding: 0.3mm 2mm;
  text-align: center;
  font-size: 8.5pt;
  border-top: 0.2mm solid #bbb;
  flex-shrink: 0;
  line-height: 1.1;
  font-weight: bold;
}

/* ══ RATE CARD ═════════════════════════════════════════════════════ */
.rate-card {
  width: 10cm;
  height: 5cm;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--fam);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.rc-header {
  display: flex;
  align-items: stretch;
  height: 1.5cm;
  flex-shrink: 0;
  border-bottom: 0.3mm solid var(--ink);
}

.rc-logospace {
  width: 5cm;
  flex-shrink: 0;
  border-right: 0.3mm solid var(--ink);
}

.rc-title-box {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--ink);
  color: var(--paper);
  font-size: 10pt;
  font-weight: bold;
  letter-spacing: 0.8px;
  text-align: center;
  padding: 1mm 2mm;
  flex-shrink: 0;
}

.rc-body    { flex: 1; padding: 2mm 3mm; display: flex; flex-direction: column; }
.rc-patient { font-size: 11pt; font-weight: bold; margin-bottom: 0.5mm; }
.rc-drug    { font-size: 10pt; margin-bottom: 1.5mm; }
.rc-text    { font-size: 10.5pt; line-height: 1.45; flex: 1; white-space: pre-wrap; }

/* ══ DATABASE TAB ═══════════════════════════════════════════════════ */
#tab-db {
  display: none;
  flex-direction: column;
  height: calc(100vh - 46px);
}

.db-toolbar {
  background: var(--surf);
  border-bottom: 1.5px solid var(--brd);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.db-info { font-size: 13px; color: var(--dim); margin-left: auto; }

.btn-sm {
  padding: 6px 14px;
  border-radius: 5px;
  border: 1px solid var(--brd2);
  font-family: var(--fam);
  font-size: 14px;
  cursor: pointer;
  background: var(--surf);
  color: var(--txt);
  transition: background .1s;
}
.btn-sm:hover { background: var(--hi2); border-color: var(--hi); color: var(--hi); }

.btn-sm.green { background: var(--gbg); border-color: var(--green); color: var(--green); }
.btn-sm.green:hover { filter: brightness(0.95); }
.btn-sm.red   { background: #fdecea; border-color: #e07070; color: var(--red); }

.db-table-wrap { flex: 1; overflow: auto; padding: 12px; }

#db-table {
  border-collapse: collapse;
  font-size: 13px;
  width: 100%;
  min-width: 1200px;
}

#db-table th {
  background: var(--hi2);
  color: var(--hi);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  padding: 8px 10px;
  border: 1px solid var(--brd);
  white-space: nowrap;
  position: sticky;
  top: 0;
}

#db-table td {
  border: 1px solid var(--brd);
  padding: 2px;
  vertical-align: middle;
  background: var(--surf);
}

#db-table tr:hover td { background: var(--card); }

#db-table td input,
#db-table td select {
  width: 100%;
  padding: 5px 7px;
  background: transparent;
  border: none;
  color: var(--txt);
  font-family: var(--fam);
  font-size: 13px;
}

#db-table td input:focus,
#db-table td select:focus {
  outline: 2px solid var(--hi);
  background: var(--hi2);
  border-radius: 2px;
}

#db-table td select option { background: #fff; }

.del-btn {
  padding: 3px 8px;
  background: #fdecea;
  border: 1px solid #e07070;
  color: var(--red);
  border-radius: 3px;
  cursor: pointer;
  font-size: 11px;
  font-family: var(--fam);
}
.del-btn:hover { background: #f5c5c5; }

/* ── Toast ──────────────────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1e3a2c;
  border: 1px solid var(--green);
  color: #5cc98c;
  padding: 10px 18px;
  border-radius: 7px;
  font-size: 14px;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  z-index: 9999;
}
.toast.show { opacity: 1; }

/* ── Utility ─────────────────────────────────────────────────────── */
.hidden { display: none !important; }

/* ══ PRINT ══════════════════════════════════════════════════════════ */
@media print {
  @page { size: 10cm 5cm; margin: 0; }

  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

  #topnav, #tab-sticker, #tab-db { display: none !important; }
  #print-area { display: block !important; }

  .rate-card { page-break-after: always; }

  .stk-warn     { background: #555 !important; color: #fff !important; }
  .rc-title-box { background: #555 !important; color: #fff !important; }
}
</style>
</head>
<body>

<!-- ══ TOP NAV ═══════════════════════════════════════════════════ -->
<nav id="topnav">
  <span class="app-logo">&#9651; Chemo Label</span>
  <button class="tab-btn active" id="tab-btn-sticker">Label Generator</button>
  <button class="tab-btn"        id="tab-btn-db">Drug Database</button>
</nav>

<!-- ══ TAB 1 — LABEL GENERATOR ═══════════════════════════════════ -->
<div id="tab-sticker" style="display:flex">

  <!-- Sidebar form -->
  <div id="sidebar">

    <div class="sec">
      <div class="sec-title">Patient</div>
      <div class="field">
        <label>ชื่อ-สกุล (Name)</label>
        <input id="f-name" type="text" placeholder="นาย/นาง/น.ส. ชื่อ สกุล" autocomplete="off">
      </div>
      <div class="row2">
        <div class="field">
          <label>HN</label>
          <input id="f-hn" type="text" placeholder="48-xx-xxxxxx">
        </div>
        <div class="field">
          <label>Ward / Room</label>
          <input id="f-room" type="text" placeholder="OPD / ห้อง">
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Drug</div>
      <div class="field">
        <label>Cytotoxic Drug</label>
        <select id="f-drug"><option value="">— Select drug —</option></select>
      </div>
      <div class="row2">
        <div class="field">
          <label>Dose</label>
          <input id="f-dose" type="number" placeholder="0" step="any" min="0">
        </div>
        <div class="field">
          <label>Unit <span class="atag">auto</span></label>
          <select id="f-unit">
            <option value="mg">mg</option>
            <option value="Gm">Gm</option>
            <option value="mcg">mcg</option>
            <option value="Unit">Unit</option>
            <option value="mL">mL</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Drug Vol (mL) <span class="atag">calc</span></label>
          <div class="abox dim" id="d-dvol">—</div>
        </div>
        <div class="field">
          <label>Diluent <span class="atag">auto</span></label>
          <div class="abox dim" id="d-dil">—</div>
        </div>
      </div>
      <div class="field">
        <label>Total Bag Vol (mL) — 0 for SC / bolus</label>
        <input id="f-bagvol" type="number" placeholder="e.g. 100" step="any" min="0" value="0">
      </div>
      <div class="field">
        <label>Rate <span class="atag">auto · editable</span></label>
        <textarea id="f-rate" rows="2" placeholder="auto-filled from drug"></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label>Storage <span class="atag">auto</span></label>
          <div class="abox dim" id="d-stor">—</div>
        </div>
        <div class="field">
          <label>Conc. <span class="atag">auto</span></label>
          <div class="abox dim" id="d-conc">—</div>
        </div>
      </div>
      <div class="field">
        <label>Special instruction <span class="atag">auto</span></label>
        <div class="abox dim" id="d-cmt">—</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Preparation Date &amp; Time</div>
      <div class="row2">
        <div class="field">
          <label>Prep Date</label>
          <input id="f-prepdate" type="date">
        </div>
        <div class="field">
          <label>Prep Time</label>
          <input id="f-preptime" type="time">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Exp Date <span class="atag">calc</span></label>
          <div class="abox dim" id="d-expdate">—</div>
        </div>
        <div class="field">
          <label>Exp Time <span class="atag">calc</span></label>
          <div class="abox dim" id="d-exptime">—</div>
        </div>
      </div>
      <div class="field">
        <label>Stability <span class="atag">auto</span></label>
        <div class="abox dim" id="d-expnote">—</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Staff</div>
      <div class="row3">
        <div class="field">
          <label>ผู้เตรียม</label>
          <select id="f-prep"><option value="">—</option></select>
        </div>
        <div class="field">
          <label>ผู้ทำ STK</label>
          <select id="f-label"><option value="">—</option></select>
        </div>
        <div class="field">
          <label>ผู้เช็ค</label>
          <select id="f-check"><option value="">—</option></select>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Options</div>
      <div class="field">
        <label style="flex-direction:row;gap:8px;align-items:center;cursor:pointer;">
          <input id="f-ratecard" type="checkbox" style="width:auto;margin:0;">
          Add rate-instruction label (page 2)
        </label>
      </div>
      <div class="field hidden" id="ratetext-wrap">
        <label>Rate instructions</label>
        <textarea id="f-ratetext" rows="4"
          placeholder="e.g.&#10;IV drip 40 mL/hr × 1 hr&#10;Then IV drip 80 mL/hr × 1 hr&#10;Then IV drip 100 mL/hr จนหมด"></textarea>
      </div>
    </div>

    <button class="btn-print" id="btn-print">&#128424;  Print / Save PDF</button>
    <button class="btn-clear" id="btn-clear">Clear form</button>

  </div><!-- /sidebar -->

  <!-- Preview panel -->
  <div id="preview-panel">

    <div class="prev-label">Label Preview — 10 cm × 5 cm</div>
    <div class="scale-host">
      <div class="scale-wrap">
        <div class="sticker" id="stk-screen"></div>
      </div>
    </div>

    <div id="rate-preview-outer" class="hidden">
      <div class="prev-label" style="text-align:center;">Rate Card — Page 2</div>
      <div class="scale-host">
        <div class="scale-wrap">
          <div class="rate-card" id="rc-screen"></div>
        </div>
      </div>
    </div>

  </div>

</div><!-- /tab-sticker -->

<!-- ══ TAB 2 — DATABASE EDITOR ════════════════════════════════════ -->
<div id="tab-db">
  <div class="db-toolbar">
    <button class="btn-sm green" id="db-btn-save">&#8595; Save JSON</button>
    <button class="btn-sm"       id="db-btn-load">&#8593; Load JSON</button>
    <input id="json-file-input" type="file" accept=".json" style="display:none">
    <button class="btn-sm"       id="db-btn-add">+ Add Drug</button>
    <button class="btn-sm red"   id="db-btn-reset">Reset Defaults</button>
    <span class="db-info" id="db-count"></span>
  </div>
  <div class="db-table-wrap">
    <table id="db-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Drug Name</th>
          <th>Trade Name</th>
          <th>Exp</th>
          <th>Day/Hr</th>
          <th>Storage</th>
          <th>RT Stable</th>
          <th>mAb</th>
          <th>Conc (mg/mL)</th>
          <th>Dose Unit</th>
          <th>Comment</th>
          <th>Default Rate</th>
          <th>Diluent</th>
          <th>Route</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="db-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ══ PRINT AREA ════════════════════════════════════════════════ -->
<div id="print-area" style="display:none">
  <div class="sticker"   id="stk-print"></div>
  <div class="rate-card hidden" id="rc-print"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>

</body>
</html>
