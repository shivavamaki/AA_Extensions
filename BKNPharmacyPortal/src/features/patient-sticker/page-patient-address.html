<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Patient Address Sticker</title>

  <style>
    @font-face {
      font-family: 'Sarabun';
      src: url('../../assets/fonts/Sarabun-Regular.ttf') format('truetype');
    }

    body {
      margin: 0;
      font-family: 'Sarabun', sans-serif;
    }

    /* ── Controls ────────────────────────────── */
    .controls {
      display: flex;
      gap: 8px;
      padding: 8px;
      border-bottom: 1px solid #ddd;
      align-items: center;
      flex-wrap: wrap;
    }

    .print-btn {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      border: none;
      border-radius: 4px;
      background: #1976d2;
    }

    .copy-btn {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      color: #fff;
      border: none;
      border-radius: 4px;
      background: #43a047;
    }

    input {
      padding: 5px;
      font-size: 13px;
      width: 140px;
      font-family: 'Sarabun', sans-serif;
    }

    /* ── Sticker ─────────────────────────────── */
    #sticker-container {
      width: 100mm;
      height: 50mm;
      box-sizing: border-box;

      /* Position offset — adjust if sticker label is misaligned on printer */
      transform: translate(0mm, 0mm);

      /* Internal padding */
      padding: 10mm 4mm 4mm 2mm;

      /* Debug cut guide — comment out in production */
      border: 0.3mm dashed rgba(0, 0, 0, 0.4);

      background: #fff;
      font-size: 15px;
      line-height: 1.4;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .name {
      font-weight: 600;
      font-size: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .address {
      font-size: 15px;
      word-break: break-word;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .phone {
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Toast ───────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #323232;
      color: #fff;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 9999;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Print ───────────────────────────────── */
    @media print {
      @page {
        size: 100mm 50mm;
        margin: 0;
      }

      body     { margin: 0; }
      .controls{ display: none !important; }

      #sticker-container {
        transform: translate(0mm, 0mm);
        margin: 0;
        padding: 20mm 4mm 4mm 2mm;
        border: none;
        background: #fff;
      }
    }
  </style>
</head>

<body>

  <div class="controls">
    <button class="print-btn" id="printBtn">🖨 Print</button>
    <button class="copy-btn"  id="copyBtn" >📋 Copy</button>

    <label>Name    <input id="nameInput"    placeholder="ชื่อผู้รับ" /></label>
    <label>Address <input id="addressInput" placeholder="ที่อยู่"   /></label>
    <label>Phone   <input id="phoneInput"   placeholder="เบอร์โทร"  /></label>
  </div>

  <div id="sticker-container"></div>

  <div id="toast">Copied to clipboard</div>

  <!-- Core shared modules -->
  <script src="../../core/messages.js"></script>
  <script src="../../core/utils.js"></script>
  <script src="../../core/dom.js"></script>

  <!-- Feature page script -->
  <script src="page-patient-address.js"></script>

</body>
</html>
