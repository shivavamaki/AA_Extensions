<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Medication Sticker</title>

  <style>
    @page {
      size: 10cm 5cm;
      margin: 0;
    }

    @font-face {
      font-family: 'THSarabun';
      src: url('../../assets/fonts/THSarabunNew.ttf') format('truetype');
      font-weight: normal;
    }

    @font-face {
      font-family: 'THSarabun';
      src: url('../../assets/fonts/THSarabunNew-Bold.ttf') format('truetype');
      font-weight: bold;
    }

    body {
      margin: 0;
      font-family: 'THSarabun', sans-serif;
      color: #000;
    }

    /* ── Toolbar ─────────────────────────────── */
    .toolbar {
      position: sticky;
      top: 0;
      background: #1f2937;
      color: #fff;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 9999;
    }

    .toolbar button,
    .toolbar select {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── Sticker page ────────────────────────── */
    .page {
      width: 10cm;
      height: 5cm;
      box-sizing: border-box;
      page-break-after: always;
    }

    .top-space {
      height: 1.5cm;
      width: 100%;
    }

    .sticker {
      height: calc(5cm - 1.5cm);
      padding: 4px 6px;
      font-size: 20px;
      box-sizing: border-box;
    }

    .drug {
      font-weight: bold;
      font-size: 20px;
    }

    .row {
      margin-top: 3px;
      line-height: 1.2;
    }

    /* ── Print ───────────────────────────────── */
    @media print {
      .toolbar { display: none; }
      body      { margin: 0; }
    }
  </style>
</head>

<body>

  <div class="toolbar">
    <button id="btnPrint">🖨 Print</button>
    <button id="btnPdf">📄 Save PDF</button>

    <select id="lang">
      <option value="">🌐 Translate</option>

      <optgroup label="🌏 Southeast Asia">
        <option value="th">Thai</option>
        <option value="lo">Lao</option>
        <option value="my">Myanmar</option>
        <option value="km">Khmer (Cambodian)</option>
        <option value="vi">Vietnamese</option>
        <option value="id">Indonesian</option>
        <option value="ms">Malay</option>
        <option value="tl">Filipino (Tagalog)</option>
      </optgroup>

      <optgroup label="🌏 East Asia">
        <option value="zh-CN">Chinese (Simplified)</option>
        <option value="zh-TW">Chinese (Traditional)</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="mn">Mongolian</option>
      </optgroup>

      <optgroup label="🌏 South Asia">
        <option value="hi">Hindi</option>
        <option value="bn">Bengali</option>
        <option value="ur">Urdu</option>
        <option value="ta">Tamil</option>
        <option value="te">Telugu</option>
        <option value="ml">Malayalam</option>
        <option value="kn">Kannada</option>
        <option value="si">Sinhala</option>
        <option value="ne">Nepali</option>
      </optgroup>

      <optgroup label="🌍 Middle East">
        <option value="ar">Arabic</option>
        <option value="fa">Persian (Farsi)</option>
        <option value="he">Hebrew</option>
        <option value="tr">Turkish</option>
      </optgroup>

      <optgroup label="🇪🇺 Europe">
        <option value="en">English</option>
        <option value="de">German</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="pt">Portuguese</option>
        <option value="it">Italian</option>
        <option value="nl">Dutch</option>
        <option value="pl">Polish</option>
        <option value="cs">Czech</option>
        <option value="sk">Slovak</option>
        <option value="hu">Hungarian</option>
        <option value="ro">Romanian</option>
        <option value="bg">Bulgarian</option>
        <option value="el">Greek</option>
        <option value="uk">Ukrainian</option>
        <option value="ru">Russian</option>
        <option value="sv">Swedish</option>
        <option value="da">Danish</option>
        <option value="fi">Finnish</option>
        <option value="no">Norwegian</option>
      </optgroup>

      <optgroup label="🌎 Americas">
        <option value="es">Spanish (Latin America)</option>
        <option value="pt-BR">Portuguese (Brazil)</option>
        <option value="ht">Haitian Creole</option>
      </optgroup>
    </select>

    <button id="btnRevert">↩ Revert</button>
  </div>

  <!-- Sticker output container -->
  <div id="container"></div>

  <!-- Core shared modules -->
  <script src="../../core/messages.js"></script>
  <script src="../../core/utils.js"></script>
  <script src="../../core/dom.js"></script>

  <!-- Third-party & translation -->
  <script src="../../shared/translate-core.js"></script>
  <script src="../../shared/medical-glossary.js"></script>

  <!-- Feature page script -->
  <script src="page-med-sticker.js"></script>

</body>
</html>
