<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <title>Med Reconcile Sticker</title>
  <style>
    @font-face {
      font-family: 'Sarabun';
      src: url('../../assets/fonts/Sarabun-Regular.ttf') format('truetype');
      font-weight: normal;
    }
    @font-face {
      font-family: 'Sarabun';
      src: url('../../assets/fonts/THSarabunNew-Bold.ttf') format('truetype');
      font-weight: bold;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sarabun', sans-serif; background: #e5e7eb; }

    /* ── Toolbar ──────────────────────────────────────────────── */
    .toolbar {
      position: sticky; top: 0; z-index: 100;
      background: #1f2937; color: #fff;
      padding: 8px 14px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .toolbar .title { font-weight: 700; font-size: 14px; }
    .toolbar button {
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      border: none; border-radius: 4px; font-family: inherit;
    }
    .btn-print  { background: #1976d2; color: #fff; }
    .btn-add    { background: #d97706; color: #fff; }
    #drug-count { font-size: 11px; color: #9ca3af; margin-left: 4px; }

    /* ── Preview area ─────────────────────────────────────────── */
    #preview {
      padding: 20px;
      display: flex; flex-wrap: wrap; gap: 16px;
    }
    #empty-msg {
      width: 100%; padding: 40px; text-align: center;
      color: #6b7280; font-size: 14px;
    }

    /* ── Sticker wrapper (hover shows ✕) ─────────────────────── */
    .sticker-wrap {
      position: relative;
      width: 8cm;
    }
    .sticker-wrap .del-btn {
      display: none; position: absolute; top: -9px; right: -9px;
      width: 20px; height: 20px; background: #dc2626; color: #fff;
      border: none; border-radius: 50%; font-size: 12px; cursor: pointer;
      z-index: 10; line-height: 20px; text-align: center;
    }
    .sticker-wrap:hover .del-btn { display: block; }

    /* ── STICKER TYPE 1: Cover sticker ──────────────────────────── */
    .sticker-cover {
      width: 8cm; height: 3.5cm;
      background: #fff; border: 1px solid #aaa;
      padding: 0.5mm;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }

    /* ── STICKER TYPE 2: Drug sticker ────────────────────────────── */
    .sticker-drug {
      width: 8cm; height: 3.5cm;
      background: #fff; border: 1px solid #aaa;
      padding: 0.5mm;
      display: flex; flex-direction: column; justify-content: space-between;
      overflow: hidden;
    }

    /* Shared sub-elements */
    .s-toprow {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; font-weight: bold;
      border-bottom: 1px solid #888;
      padding: 0 0.5mm 0.5mm;
      margin: 0;
    }
    .s-body-center {
      flex: 1; display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
      text-align: center; line-height: 1.15;
      padding: 0 0.5mm;
      margin: 0;
      word-break: break-word;
    }
    .s-body-label {
      font-size: 12px; font-weight: bold; text-align: center;
      border-top: 1px solid #bbb; border-bottom: 1px solid #bbb;
      padding: 0.5mm 0; margin: 0;
      letter-spacing: 0.02em;
    }
    .s-footer {
      display: flex; justify-content: space-between; align-items: flex-start;
      font-size: 11px; line-height: 1.25;
      padding: 0.5mm 0.5mm 0;
      margin: 0;
    }
    .s-footer-right { text-align: right; }
    .s-name { font-size: 13px; font-weight: bold; }
    .s-barcode { display: flex; justify-content: center; padding: 0; margin: 0; }
    .s-barcode svg { max-width: 7.5cm; display: block; }

    /* ── Print ────────────────────────────────────────────────── */
    @media print {
      @page {
        size: 8cm 3.5cm;
        margin: 0;
      }

      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: #fff;
        width: 8cm;
      }

      .toolbar  { display: none !important; }

      #preview {
        padding: 0 !important;
        margin:  0 !important;
        gap:     0 !important;
        display: block;
      }

      .sticker-wrap {
        width: 8cm !important;
        margin:  0 !important;
        padding: 0 !important;
        page-break-after: always;
        break-after: page;
      }

      .sticker-cover,
      .sticker-drug {
        width:   8cm   !important;
        height:  3.5cm !important;
        margin:  0     !important;
        border:  none  !important;
        box-shadow: none !important;
      }

      .del-btn { display: none !important; }
    }

    /* ── Toast ────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #323232; color: #fff;
      padding: 8px 14px; border-radius: 6px; font-size: 13px;
      opacity: 0; transform: translateY(8px);
      transition: all 0.25s; z-index: 9999;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<div class="toolbar">
  <span class="title">💊 Med Reconcile Sticker</span>
  <button class="btn-print" id="btnPrint">🖨 Print All</button>
  <button class="btn-add"   id="btnAdd" >＋ Add Drug</button>
  <span id="drug-count"></span>
</div>

<div id="preview">
  <div id="empty-msg">No data — open from the patient page.</div>
</div>

<div id="toast"></div>

<script src="../../core/messages.js"></script>
<script src="../../core/utils.js"></script>
<script src="../../core/dom.js"></script>
<script src="../../vendor/jsbarcode.min.js"></script>
<script src="page-med-reconcile.js"></script>
</body>
</html>
