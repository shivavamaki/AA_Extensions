<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>DC List Viewer</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#f4f5f7;--surface:#fff;--primary:#1976d2;--primary-dark:#1256a3;
      --danger:#d32f2f;--success:#2e7d32;--purple:#7c3aed;
      --border:#dde1e7;--text:#1a1a2e;--muted:#6b7280;
      --radius:8px;--shadow:0 2px 8px rgba(0,0,0,.10);
    }
    body{font-family:"Segoe UI",Arial,"Sarabun",sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh;}

    /* topbar */
    .topbar{position:sticky;top:0;z-index:200;background:var(--primary);color:#fff;padding:0 16px;height:50px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.2);}
    .topbar h1{font-size:15px;font-weight:600;flex:1;}
    .topbar .count{font-size:11px;opacity:.8;}

    /* toolbar */
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);}
    .toolbar input[type=text]{padding:5px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:13px;width:200px;}
    .toolbar input:focus{outline:2px solid var(--primary);border-color:transparent;}

    .btn{padding:5px 12px;border:none;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:opacity .15s,transform .1s;}
    .btn:hover{opacity:.88;transform:translateY(-1px);}
    .btn:active{transform:none;}
    .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .btn-primary{background:var(--primary);color:#fff;}
    .btn-danger{background:var(--danger);color:#fff;}
    .btn-success{background:var(--success);color:#fff;}
    .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
    .btn-ghost{background:#f3f4f6;color:#374151;border:1px solid var(--border);}

    /* layout */
    .layout{display:flex;height:calc(100vh - 50px - 48px);}

    /* sidebar — hidden by default */
    .sidebar{
      width:0;overflow:hidden;
      background:var(--surface);border-right:1px solid var(--border);
      transition:width .25s ease;
      display:flex;flex-direction:column;flex-shrink:0;
    }
    .sidebar.open{width:220px;overflow-y:auto;}
    .sidebar-header{padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:#f9fafb;white-space:nowrap;}
    .snap-item{padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;position:relative;white-space:nowrap;}
    .snap-item:hover{background:#f0f4ff;}
    .snap-item.active{background:#e8f0fe;border-left:3px solid var(--primary);}
    .snap-item .snap-date{font-size:11px;font-weight:600;}
    .snap-item .snap-meta{font-size:10px;color:var(--muted);margin-top:2px;}
    .snap-item .snap-del{position:absolute;top:6px;right:6px;background:transparent;border:none;cursor:pointer;font-size:13px;opacity:0;color:var(--danger);}
    .snap-item:hover .snap-del{opacity:1;}
    .no-snaps{padding:16px 12px;color:var(--muted);font-size:12px;text-align:center;}

    /* main */
    .main{flex:1;overflow:auto;padding:16px;}
    .panel-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
    .panel-title{font-size:16px;font-weight:700;}
    .panel-sub{font-size:12px;color:var(--muted);margin-top:2px;}

    /* stats */
    .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;min-width:100px;box-shadow:var(--shadow);}
    .stat-card .val{font-size:20px;font-weight:700;color:var(--primary);}
    .stat-card .lbl{font-size:10px;color:var(--muted);margin-top:1px;}

    /* checklist badges */
    .cl-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;}
    .cl-yes{background:#dcfce7;color:#166534;}
    .cl-no{background:#fee2e2;color:#991b1b;}

    /* section toggle headers */
    .section-toggle{
      display:flex;align-items:center;justify-content:space-between;
      padding:8px 12px;background:#f0f4ff;border:1px solid var(--border);
      border-radius:var(--radius);cursor:pointer;user-select:none;
      font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#374151;
      margin-bottom:0;
    }
    .section-toggle:hover{background:#e0eaff;}
    .section-toggle .arrow{font-size:10px;transition:transform .2s;}
    .section-toggle.open .arrow{transform:rotate(180deg);}
    .section-body{display:none;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:12px;margin-bottom:12px;}
    .section-body.open{display:block;}

    /* checklist section */
    .checklist-section{margin-bottom:12px;}

    /* audit table */
    .audit-table{width:100%;border-collapse:collapse;font-size:12px;}
    .audit-table th{background:#f0f4ff;padding:6px 10px;text-align:left;font-weight:700;font-size:11px;border-bottom:1px solid var(--border);}
    .audit-table td{padding:6px 10px;border-bottom:1px solid #f3f4f6;}
    .audit-table tr:last-child td{border-bottom:none;}
    .action-badge{padding:2px 7px;border-radius:10px;font-size:10px;font-weight:600;}
    .action-created{background:#dbeafe;color:#1e40af;}
    .action-updated{background:#fef9c3;color:#854d0e;}

    /* main checklist table */
    .cl-table-wrap{overflow-x:auto;}
    .cl-table{border-collapse:collapse;width:100%;font-size:13px;}

    /* frozen queue + patient columns */
    .cl-table th,
    .cl-table td{padding:8px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
    .cl-table thead th{background:#f0f4ff;font-weight:700;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:3;}

    /* col-q: queue number — sticky leftmost */
    .col-q{
      position:sticky;left:0;z-index:4;
      background:#f0f4ff;width:40px;min-width:40px;
      text-align:center;font-weight:700;color:var(--muted);font-size:11px;
      border-right:2px solid var(--border);
    }
    .cl-table tbody .col-q{background:#fff;z-index:2;}
    .cl-table tbody tr:hover .col-q{background:#f7f9ff;}

    /* col-pt: patient (bed + name) */
    .col-pt{
      position:sticky;left:40px;z-index:3;background:#f0f4ff;
      min-width:160px;border-right:1px solid var(--border);
    }
    .cl-table tbody .col-pt{background:#fff;z-index:1;}
    .cl-table tbody tr:hover .col-pt{background:#f7f9ff;}

    /* checklist cell */
    .cl-table td.cl-cell{text-align:center;padding:6px 8px;}

    /* row done = all checked → move up via JS sort, highlight */
    .cl-table tbody tr.row-done{background:#f0fdf4;}
    .cl-table tbody tr.row-done .col-q,
    .cl-table tbody tr.row-done .col-pt{background:#f0fdf4;}

    /* progress mini bar */
    .prog-bar{height:4px;background:#e5e7eb;border-radius:2px;margin-top:3px;}
    .prog-fill{height:100%;border-radius:2px;background:var(--primary);transition:width .3s;}
    .prog-fill.done{background:var(--success);}

    /* patient label */
    .pt-bed{font-weight:700;font-size:13px;}
    .pt-name{font-size:11px;color:var(--muted);margin-top:1px;}

    /* empty state */
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60%;gap:12px;color:var(--muted);}
    .empty-state .icon{font-size:48px;}
    .empty-state p{font-size:15px;}

    mark{background:#fff3a0;border-radius:2px;}

    /* modal */
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;}
    .modal{background:#fff;border-radius:12px;padding:24px;max-width:440px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.2);}
    .modal h2{font-size:16px;margin-bottom:8px;}
    .modal p{font-size:13px;color:var(--muted);margin-bottom:18px;}
    .modal .actions{display:flex;gap:8px;justify-content:flex-end;}

    @media print{
      .topbar,.toolbar,.sidebar,.modal-bg,.section-toggle{display:none!important;}
      .section-body{display:block!important;}
      .main{overflow:visible;padding:0;}
      .layout{height:auto;}
    }
  </style>
</head>
<body>

<div class="topbar">
  <button class="btn btn-ghost" id="btn-toggle-sidebar" title="Toggle snapshot list" style="padding:4px 8px;font-size:13px;">☰</button>
  <h1>📋 DC List Viewer</h1>
  <span class="count" id="snap-count">0 snapshots</span>
</div>

<div class="toolbar">
  <input type="text" id="search-box" placeholder="🔍 Search bed, name, MRN…"/>
  <button class="btn btn-success" id="btn-export-json">⬇ JSON</button>
  <button class="btn btn-primary"  id="btn-export-csv" >⬇ CSV</button>
  <button class="btn btn-outline"  id="btn-print"      >🖨 Print</button>
  <button class="btn btn-danger"   id="btn-clear-all"  >🗑 Clear All</button>
</div>

<div class="layout">

  <!-- Sidebar: hidden by default, toggled via ☰ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">Snapshots</div>
    <div id="snap-list"></div>
  </aside>

  <main class="main" id="main-panel">

    <div class="empty-state" id="empty-state">
      <div class="icon">🗂️</div>
      <p>No snapshot loaded.</p>
      <p style="font-size:12px;">Use <strong>🔄 Update Patient List</strong> on the HIS page<br>then reload this viewer.</p>
    </div>

    <div id="data-view" style="display:none;">

      <div class="panel-header">
        <div>
          <div class="panel-title" id="view-title">—</div>
          <div class="panel-sub"   id="view-sub"  >—</div>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-danger" id="btn-delete-snap">🗑 Delete</button>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats" id="stats-strip"></div>

      <!-- Main checklist table (always visible) -->
      <div class="checklist-section">
        <div class="cl-table-wrap">
          <table class="cl-table" id="cl-main-table">
            <thead id="cl-head"></thead>
            <tbody id="cl-body"></tbody>
          </table>
        </div>
      </div>

      <!-- Audit log — collapsed by default -->
      <div style="margin-bottom:12px;">
        <div class="section-toggle" id="toggle-audit">
          <span>📝 Audit Log</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body" id="body-audit">
          <div id="audit-panel" style="overflow-x:auto;"></div>
        </div>
      </div>

      <!-- Raw data table — collapsed by default -->
      <div style="margin-bottom:12px;">
        <div class="section-toggle" id="toggle-raw">
          <span>📄 Raw Data Table</span>
          <span class="arrow">▼</span>
        </div>
        <div class="section-body" id="body-raw">
          <div style="overflow-x:auto;">
            <table id="data-table" style="border-collapse:collapse;width:100%;font-size:12px;">
              <thead id="table-head" style=""></thead>
              <tbody id="table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

    </div><!-- /data-view -->
  </main>
</div>

<div class="modal-bg" id="confirm-modal" style="display:none;">
  <div class="modal">
    <h2 id="modal-title">Confirm</h2>
    <p  id="modal-body">Are you sure?</p>
    <div class="actions">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger"  id="modal-ok">Delete</button>
    </div>
  </div>
</div>

<script src="../../core/messages.js"></script>
<script src="../../core/utils.js"></script>
<script src="../../core/dom.js"></script>
<script src="../../core/storage.js"></script>
<script src="viewer-discharge-list.js"></script>
</body>
</html>
