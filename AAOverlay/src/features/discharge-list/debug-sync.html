<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sync Debug</title>
  <style>
    body { font-family: "Segoe UI", monospace; background:#0f172a; color:#e2e8f0; margin:0; padding:20px; font-size:13px; }
    h1   { color:#60a5fa; font-size:16px; margin-bottom:16px; }
    .card{ background:#1e293b; border-radius:8px; padding:14px; margin-bottom:12px; border:1px solid #334155; }
    .card h2 { font-size:12px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
    .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #1e293b; }
    .label { color:#94a3b8; }
    .value { color:#e2e8f0; font-weight:600; }
    .value.ok   { color:#4ade80; }
    .value.warn { color:#fb923c; }
    .value.err  { color:#f87171; }
    .btn { padding:7px 14px; border:none; border-radius:6px; cursor:pointer; font-size:12px; font-weight:700; margin-right:8px; margin-bottom:8px; }
    .btn-blue   { background:#1d4ed8; color:#fff; }
    .btn-green  { background:#15803d; color:#fff; }
    .btn-red    { background:#b91c1c; color:#fff; }
    .btn-purple { background:#7c3aed; color:#fff; }
    .btn:hover  { opacity:.85; }
    pre { background:#0f172a; border-radius:6px; padding:12px; overflow:auto; max-height:300px; font-size:11px; color:#a5f3fc; white-space:pre-wrap; word-break:break-all; margin:0; }
    .status { padding:8px 12px; border-radius:6px; font-size:12px; font-weight:700; margin-bottom:8px; }
    .status.ok   { background:#14532d; color:#4ade80; }
    .status.err  { background:#7f1d1d; color:#fca5a5; }
    .status.info { background:#1e3a5f; color:#93c5fd; }
    #log { font-size:11px; color:#94a3b8; background:#0f172a; border-radius:6px; padding:12px; max-height:250px; overflow:auto; }
    .log-ok   { color:#4ade80; }
    .log-warn { color:#fb923c; }
    .log-err  { color:#f87171; }
    .log-info { color:#93c5fd; }
  </style>
</head>
<body>

<h1>🔧 Sync Storage Debug</h1>

<div class="card">
  <h2>Status</h2>
  <div class="row"><span class="label">Bridge server (localhost:7755)</span><span class="value" id="s-bridge">checking…</span></div>
  <div class="row"><span class="label">chrome.storage.sync</span><span class="value" id="s-available">checking…</span></div>
  <div class="row"><span class="label">Bytes used / quota</span><span class="value" id="s-quota">—</span></div>
  <div class="row"><span class="label">HM sync keys found</span><span class="value" id="s-keys">—</span></div>
  <div class="row"><span class="label">Today's key</span><span class="value" id="s-today">—</span></div>
  <div class="row"><span class="label">Today's patients</span><span class="value" id="s-patients">—</span></div>
</div>

<div class="card">
  <h2>Actions</h2>
  <button class="btn btn-blue"   id="btn-refresh">🔄 Refresh Status</button>
  <button class="btn btn-green"  id="btn-write-test">✏️ Write Test Entry</button>
  <button class="btn btn-blue"   id="btn-read-test">📖 Read Today's Data</button>
  <button class="btn btn-purple" id="btn-dump">🗂 Dump All Sync Keys</button>
  <button class="btn btn-red"    id="btn-clear-sync">🗑 Clear All HM Sync Keys</button>
</div>

<div class="card">
  <h2>Raw Data</h2>
  <pre id="raw-out">— press an action —</pre>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="log"></div>
</div>

<script src="../../core/messages.js"></script>
<script src="../../core/utils.js"></script>
<script src="../../core/dom.js"></script>
<script src="../../core/storage.js"></script>
<script src="debug-sync.js"></script>
</body>
</html>
