<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaccine Schedule — BKN Pharmacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:       #1e40af;
      --blue-mid:   #2563eb;
      --blue-lt:    #dbeafe;
      --teal:       #0d9488;
      --green:      #10b981;
      --green-lt:   #d1fae5;
      --amber:      #d97706;
      --amber-lt:   #fef3c7;
      --orange:     #ea580c;
      --orange-lt:  #ffedd5;
      --purple:     #7c3aed;
      --purple-lt:  #ede9fe;
      --red:        #dc2626;
      --red-lt:     #fee2e2;
      --cyan:       #0891b2;
      --cyan-lt:    #cffafe;
      --bg:         #f1f5f9;
      --card:       #ffffff;
      --border:     #e2e8f0;
      --text:       #1e293b;
      --text-mid:   #475569;
      --text-soft:  #94a3b8;
      --shadow:     0 1px 4px rgba(0,0,0,.08), 0 2px 12px rgba(0,0,0,.06);
      --radius:     12px;
      --radius-sm:  7px;
      --font:       'IBM Plex Sans Thai', system-ui, sans-serif;
      --mono:       'IBM Plex Mono', monospace;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Top bar ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--blue);
      color: #fff;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      height: 54px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .topbar-icon { font-size: 22px; flex-shrink: 0; }
    .topbar-title { font-size: 16px; font-weight: 700; letter-spacing: .2px; flex: 1; min-width: 0; }
    .topbar-sub { font-size: 11px; opacity: .7; margin-top: 1px; }

    /* ── Controls bar ── */
    .controls {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ctrl-group { display: flex; align-items: center; gap: 8px; }
    .ctrl-label { font-size: 12px; font-weight: 600; color: var(--text-mid); white-space: nowrap; }
    .ctrl-date {
      font-family: var(--mono);
      font-size: 13px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      cursor: pointer;
    }
    .ctrl-date:focus { border-color: var(--blue-mid); }

    .ctrl-search {
      flex: 1;
      min-width: 160px;
      font-family: var(--font);
      font-size: 13px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }
    .ctrl-search:focus { border-color: var(--blue-mid); }

    .seg-btn {
      padding: 5px 11px;
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--bg);
      color: var(--text-mid);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .seg-btn.active {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
    }

    .chip-filter-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-mid);
      cursor: pointer;
      transition: background .15s, color .15s, border-color .15s;
    }
    .chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .chip.filter-day.active { background: var(--red); border-color: var(--red); }
    .chip.filter-month.active { background: var(--green); border-color: var(--green); }
    .chip.filter-stat.active { background: var(--amber); border-color: var(--amber); }

    /* ── Summary bar ── */
    .summary-bar {
      padding: 8px 20px;
      font-size: 11px;
      color: var(--text-soft);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ── Cards ── */
    .cards-grid {
      padding: 12px 20px 32px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 14px;
    }

    .vac-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .vac-card-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
    }
    .vac-name {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .badge-row { display: flex; gap: 5px; align-items: center; flex-shrink: 0; flex-wrap: wrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: .3px;
    }
    .badge-route-ID     { background: var(--purple-lt); color: var(--purple); }
    .badge-route-IM     { background: var(--blue-lt);   color: var(--blue); }
    .badge-route-SC     { background: var(--green-lt);  color: var(--teal); }
    .badge-route-Oral   { background: var(--amber-lt);  color: var(--amber); }
    .badge-factor-day   { background: var(--red-lt);    color: var(--red); }
    .badge-factor-month { background: var(--green-lt);  color: var(--teal); }
    .badge-factor-STAT  { background: var(--amber-lt);  color: var(--amber); }

    /* ── Dose table ── */
    .dose-table {
      width: 100%;
      border-collapse: collapse;
    }
    .dose-table th {
      padding: 6px 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--text-soft);
      background: #f8fafc;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .dose-table td {
      padding: 8px 12px;
      vertical-align: top;
      border-bottom: 1px solid #f1f5f9;
      font-size: 12px;
    }
    .dose-table tr:last-child td { border-bottom: none; }

    .dose-num {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .dose-1 { background: var(--blue-lt);   color: var(--blue); }
    .dose-2 { background: var(--green-lt);  color: var(--teal); }
    .dose-3 { background: var(--amber-lt);  color: var(--amber); }
    .dose-4 { background: var(--purple-lt); color: var(--purple); }
    .dose-5 { background: var(--red-lt);    color: var(--red); }

    .dose-sched {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--text-mid);
      white-space: nowrap;
    }
    .dose-dates { display: flex; flex-direction: column; gap: 2px; }
    .dose-date-th {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }
    .dose-date-en {
      font-size: 12px;
      color: var(--text-mid);
    }

    /* language visibility */
    .lang-th-hidden .dose-date-th { display: none; }
    .lang-en-hidden .dose-date-en { display: none; }

    /* ── Note section ── */
    .vac-note {
      padding: 0 16px;
    }
    .vac-note-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      padding: 8px 0;
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-soft);
      cursor: pointer;
      text-align: left;
      transition: color .15s;
    }
    .vac-note-toggle:hover { color: var(--blue-mid); }
    .note-chevron { font-size: 10px; transition: transform .2s; display: inline-block; }
    .vac-note-toggle[aria-expanded="true"] .note-chevron { transform: rotate(180deg); }
    .vac-note-body {
      padding-bottom: 12px;
      font-size: 12px;
      color: var(--text-mid);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .vac-note-body[hidden] { display: none !important; }

    .avail-pill {
      display: inline-block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 10px;
      font-weight: 600;
      border-radius: 4px;
      padding: 2px 7px;
      margin-top: 4px;
    }

    /* ── Empty state ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-soft);
    }
    .empty-state-icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state-text { font-size: 14px; }

    @media (max-width: 520px) {
      .cards-grid { grid-template-columns: 1fr; padding: 10px 12px 24px; }
      .controls { padding: 10px 12px; }
      .topbar { padding: 0 14px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-icon">💉</div>
    <div>
      <div class="topbar-title">Vaccine Schedule Calculator</div>
      <div class="topbar-sub">ตารางนัดฉีดวัคซีน — BKN Pharmacy</div>
    </div>
  </div>

  <div class="controls">
    <div class="ctrl-group">
      <label class="ctrl-label" for="startDate">📅 วันเริ่มต้น</label>
      <input type="date" id="startDate" class="ctrl-date">
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">ภาษา</span>
      <div class="chip-filter-row" id="langToggle">
        <button class="seg-btn active" data-lang="both">TH + EN</button>
        <button class="seg-btn" data-lang="th">ไทย</button>
        <button class="seg-btn" data-lang="en">English</button>
      </div>
    </div>

    <input type="search" id="searchInput" class="ctrl-search" placeholder="🔍 ค้นหาวัคซีน…">

    <div class="ctrl-group">
      <span class="ctrl-label">กรอง</span>
      <div class="chip-filter-row" id="factorFilter">
        <button class="chip active" data-factor="all">ทั้งหมด</button>
        <button class="chip filter-day" data-factor="day">Day (วัน)</button>
        <button class="chip filter-month" data-factor="month">Month (เดือน)</button>
        <button class="chip filter-stat" data-factor="STAT">STAT</button>
      </div>
    </div>
  </div>

  <div class="summary-bar" id="summaryBar">แสดง 0 จาก 0 วัคซีน</div>

  <div class="cards-grid" id="cardsGrid"></div>

  <script src="app.js"></script>
</body>
</html>
